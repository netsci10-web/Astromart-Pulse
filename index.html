    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function PatchedWebSocket(url, protocols) {
          var isViteHmr =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) &&
              (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1));
          if (isViteHmr) {
            var target = new EventTarget();
            target.readyState = 1;
            target.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
            target.url = String(url || '');
            target.send = function () {};
            target.close = function () {
              target.readyState = 3;
            };
            setTimeout(function () {
              var openEvt = new Event('open');
              target.dispatchEvent(openEvt);
              if (typeof target.onopen === 'function') target.onopen(openEvt);
              var msgEvt = new MessageEvent('message', {
                data: JSON.stringify({ type: 'connected' }),
              });
              target.dispatchEvent(msgEvt);
              if (typeof target.onmessage === 'function') target.onmessage(msgEvt);
            }, 10);
            return target;
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        }
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;

        // Purge any legacy precached Service Worker bundles (v4 migration)
        try {
          var SW_MIGRATION_KEY = 'astromart_sw_migrated_v4';
          if (localStorage.getItem(SW_MIGRATION_KEY) !== 'true') {
            localStorage.setItem(SW_MIGRATION_KEY, 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var hadSw = regs && regs.length > 0;
                Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  })
                ).then(function () {
                  if ('caches' in window) {
                    caches.keys().then(function (keys) {
                      Promise.all(
                        keys.map(function (k) {
                          return caches.delete(k);
                        })
                      ).then(function () {
                        if (hadSw) {
                          window.location.reload();
                        }
                      });
                    });
                  } else if (hadSw) {
                    window.location.reload();
                  }
                });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
